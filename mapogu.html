<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마포구구 메인</title>

  <link href="./mapogu.css" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


</head>

<body>

  <header class="main-header">
    <h1 class="main-title">
      THE SEOUL SELECTION
    </h1>
    <p class="main-subtitle">
      서울의 세 가지 색깔, 미식의 정점을 만나다
    </p>
  </header>

  <!-- 카드 섹션 -->
  <div class="container py-5">
    <h1 class="text-center section-title">Mapo-gu District</h1>

    <div class="row g-4 justify-content-center">

      <div class="col-12 col-md-6 col-lg-3 border-0 ">
        <div class="card h-100 bg-white text-black border-0 ">

          <div class="ratio ratio-16x9">
            <div id="carouselTableFour" class="carousel slide">
              <div class="carousel-inner">
                <div class="carousel-item active">
                  <img src="./img/샘킴01.jpg" class="d-block w-100" alt="샘킴">
                </div>
                <div class="carousel-item">
                  <img src="./img/샘킴02.jpg" class="d-block w-100" alt="샘킴">
                </div>
                <div class="carousel-item">
                  <img src="./img/샘킴03.jpg" class="d-block w-100" alt="샘킴">
                </div>
              </div>
              <button class="carousel-control-prev" type="button" data-bs-target="#carouselTableFour"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
              </button>
              <button class="carousel-control-next" type="button" data-bs-target="#carouselTableFour"
                data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
              </button>
            </div>
          </div>

          <div class="card-body">
            <h5 class="cardtitles">오스테리아 샘킴</h5><br>
            <p class="card-texts">양식<br>
              오스테리아샘킴은 샘킴 셰프의 자연주의 요리를 경험할 수 있는 합정의 인기 레스토랑입니다.
            </p>
            <button type="button" class="btn btn-outline-dark">홈페이지 이동</button>
          </div>
        </div>
      </div>


      <div class="col-12 col-md-6 col-lg-3 border-0">
        <div class="card h-100 bg-white text-black border-0">

          <div class="ratio ratio-16x9">
            <div id="carouselSoul" class="carousel slide">
              <div class="carousel-inner">
                <div class="carousel-item active">
                  <img src="./img/정호영01.jpg" class="d-block w-100" alt="정호영">
                </div>
                <div class="carousel-item">
                  <img src="./img/정호영02.jpg" class="d-block w-100" alt="정호영">
                </div>
                <div class="carousel-item">
                  <img src="./img/정호영03.jpg" class="d-block w-100" alt="정호영">
                </div>
              </div>
              <button class="carousel-control-prev" type="button" data-bs-target="#carouselSoul" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
              </button>
              <button class="carousel-control-next" type="button" data-bs-target="#carouselSoul" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
              </button>
            </div>
          </div>

          <div class="card-body ">
            <h5 class="cardtitles">우동 카텐텐</h5><br>
            <p class="card-texts">우동,소바바<br>
              우동 카덴은 다양한 종류의 우동과 튀김 메뉴를 제공하는 일본식 우동 전문점입니다.
            </p>
            <button type="button" class="btn btn-outline-dark">홈페이지 이동</button>

          </div>
        </div>

      </div>

      <div class="col-12 col-md-6 col-lg-3">
        <div class="card h-100 bg-black text-white">

          <div id="carouselYun" class="carousel slide">
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img src="./img/무쇠팔01.jpg" class="d-block w-100" alt="무쇠팔">
              </div>
              <div class="carousel-item">
                <img src="./img/무쇠팔02.jpg" class="d-block w-100" alt="무쇠팔">
              </div>
              <div class="carousel-item">
                <img src="./img/무쇠팔03.jpg" class="d-block w-100" alt="무쇠팔팔">
              </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselYun" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselYun" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
          <div class="card-body ">
            <h5 class="cardtitles">소바쥬</h5><br>
            <p class="card-texts">일식당<br>
              소바쥬는 메밀을 주재료로 한 독창적인 일식 코스요리를 선보이는 레스토랑입니다.
            </p>
            <button type="button" class="btn btn-outline-light">홈페이지 이동</button>

          </div>
        </div>

      </div>

      <div class="col-12 col-md-6 col-lg-3">
        <div class="card h-100 bg-black text-white">

          <div id="carouselBBQ" class="carousel slide">
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img src="./img/뉴욕에서01.jpg" class="d-block w-100" alt="뉴욕에서">
              </div>
              <div class="carousel-item">
                <img src="./img/뉴욕에서02.jpg" class="d-block w-100" alt="뉴욕에서서">
              </div>
              <div class="carousel-item">
                <img src="./img/뉴욕에서서03.jpg" class="d-block w-100" alt="뉴욕에서서">
              </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselBBQ" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselBBQ" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
          <div class="card-body ">
            <h5 class="cardtitles">옥동식</h5><br>
            <p class="card-texts">국밥<br>
              옥동식은 맑고 담백한 국물이 특징인 미슐랭 선정 돼지곰탕 전문점입니다.
            </p>
            <button type="button" class="btn btn-outline-light">홈페이지 이동</button>

          </div>
        </div>
      </div>

    </div>

  </div>





  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
